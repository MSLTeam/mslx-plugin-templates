name: 发布 NuGet 模板包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号 (例如 1.0.1，留空则自动生成测试版本)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: 打包并发布到 NuGet

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 .NET 10 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            FINAL_VERSION="${RAW_TAG#v}"
            echo "触发 Tag 构建，使用版本号: $FINAL_VERSION"
          elif [[ -n "${{ inputs.custom_version }}" ]]; then
            FINAL_VERSION="${{ inputs.custom_version }}"
            echo "手动触发构建，使用指定版本号: $FINAL_VERSION"
          else
            BASE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' MSLX.Plugin.Templates.csproj || echo "1.0.0")
            TIMESTAMP=$(TZ=Asia/Hong_Kong date +'%Y%m%d.%H%M')
            FINAL_VERSION="${BASE_VERSION}-beta.${TIMESTAMP}"
            echo "手动触发构建，使用测试版本号: $FINAL_VERSION"
          fi
          
          echo "PACKAGE_VERSION=$FINAL_VERSION" >> $GITHUB_ENV

      - name: 打包模板项目
        run: |
          dotnet pack MSLX.Plugin.Templates.csproj -c Release -o ./out /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: 推送到 NuGet
        run: |
          dotnet nuget push ./out/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./out/*.nupkg
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.PACKAGE_VERSION }}
          generate_release_notes: true
          prerelease: ${{ github.ref_type != 'tag' }}
